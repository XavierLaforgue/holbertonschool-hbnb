<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="images/icon.png">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="footer.css">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&display=swap" rel="stylesheet">
</head>
<header>
        <nav>
            <a href="index.html">
                <div class="logo-div">
                    <img src="./images/logo.png" class="logo" alt="logo">
                </div>
            </a>
            <div class="nav-links">
                <a href="index.html" id="home-link" class="home-button">
                    Home
                </a>
                <a href="login.html" id="login-link" class="login-button">
                    Login
                </a>
                <a href="index.html" id="logout-link" class="logout-button">
                    Logout
                </a>
            </div>
        </nav>
    </header>
    <main>
        <form id="login-form">
            <h2>Login</h2>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            
            <button type="submit">Login</button>
        </form>
    </main>
    <footer>
        <a href="https://tenor.com/bu0cV.gif" id="all-rights-reserved">
            <img src="./images/logo.png" alt="Logo" id="footer-logo">All rights reserved
        </a>
    </footer>
    <script src="scripts.js"></script>
</body>
</html>
